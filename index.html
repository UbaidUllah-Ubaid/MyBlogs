<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Best Blogs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar header">
        <div class="container-fluid">
            <h2 class="navbar-brand">BEST BLOGS</h2>
        </div>
    </nav>


    <main class="container">

        <h1 class="page-heading">Latest Blogs</h1>

        <ul id="blogs-box" class="blogs-list">
        </ul>


        <!-- Create Blog -->

        <div class="form-container">

            <h2>Post Your Blog</h2>

            <form id="blogForm">

                <input type="text" id="title" placeholder="Enter Blog Title" required>

                <input type="text" id="author" placeholder="Enter Author Name" required>

                <textarea id="content" rows="6" placeholder="Write your blog..." required>
                </textarea>

                <button type="submit">Create Blog</button>

            </form>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
