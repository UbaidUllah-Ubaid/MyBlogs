<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <!-- Dono CSS files ko yahan link kar dein -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">

    <style>
        .error-container {
            text-align: center;
            padding: 100px 20px;
            font-family: sans-serif;
        }
        .error-code {
            font-size: 80px;
            font-weight: bold;
            color: #ff4b4b;
            margin: 0;
        }
        .error-message {
            font-size: 22px;
            margin: 20px 0;
            color: #333;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2>Oops! Page Not Found</h2>
        <p class="error-message">Aap jo page dhoond rahe hain wo exist nahi karta.</p>
        
        <a href="index.html" class="btn-home">Go Back to Home</a>
    </div>

</body>
</html>
